services:
  - type: web
    runtime: static
    name: velocicalc-lo
    repo: https://github.com/LabTechR/VelociCalc-LO
    branch: main
    buildCommand: npm test && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
